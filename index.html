<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title> Productos - Ciudadanos Invisibles </title>
        <link rel="stylesheet" href="style.css" />
        <link href='https://fonts.googleapis.com/css?family=Allura' rel='stylesheet'>
    </head>

    <body> 
       <header>
        <h1> Ciudadanos Invisibles </h1>
       <h2> Ninguna Dirección pero Nadie Invisible </h2> 
       <button class="sobre" id="sobre"> Sobre Nosotros </button>
       <button class="productos" id="productos"> Productos </button>
       <form action="https://colombia.techo.org/hazte-socio-a/">
        <button class="dona" id="dona"> DONA </button>
        </form>
       </header>
       <main> 
        <section class = "producto"> 
           <div>
            <p style="width: 280px; margin-top: 100px; margin-left: -100px; font-size: 1.6rem;"> Compra una bolsa de mano o camisetas en tallas XS, S, M, L, y XL para apoyar la causa. Entre el 30 y el 60% del dinero será donado. </p>
           </div>
            <div class="bolsa" id="bolsa">
                <img src="finalTote.png" width="250" height="350"/> 
                <p> Bolsa: $10 </p>
            </div>
            <div class="camiseta" id="camiseta"> 
                <img src="finalShirtFront.png" width="300" height="300"/>
                <p> Camiseta: $15 </p>
            </div>
            <div class="camiseta">
                <img src="finalShirtBack.png" width="300" height="300"/>
            </div>
        </section>
       </main>
    </body>
</html>
